name: Deploy GitHub Tutorial to Pages

on:
  push:
    branches: [main]
    paths:
      - "github-tutorial/**"
      - ".github/workflows/deploy-github-tutorial.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-tutorial-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-tutorial

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
